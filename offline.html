<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3B82F6">
<title>ConWork - ออฟไลน์</title>
<link rel="icon" type="image/png" href="img/icons/favicon-32.png">
<style>
  :root { --bg:#f5f7fb; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb; --brand:#3B82F6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#131c2e; --ink:#f3f4f6; --sub:#9ca3af; --line:#243047; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans Thai","Plus Jakarta Sans",system-ui,sans-serif; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 24px; text-align:center; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:20px; margin:16px 0 6px; }
  p { color:var(--sub); font-size:14px; line-height:1.6; margin:0 0 20px; }
  button { border:0; border-radius:12px; background:var(--brand); color:#fff; font:inherit; font-weight:600; padding:12px 20px; width:100%; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="img/icons/icon-192.png" alt="ConWork">
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>ConWork ต้องใช้อินเทอร์เน็ตเพื่อโหลดข้อมูลล่าสุด<br>เมื่อกลับมาออนไลน์ หน้านี้จะโหลดใหม่ให้เอง</p>
    <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
